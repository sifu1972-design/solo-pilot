name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SoloPilot.apk

      - name: Publish to the "latest" download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build ${{ github.run_number }}. Download SoloPilot.apk on your phone and open it to install."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest SoloPilot.apk --clobber
            gh release edit latest --title "Solo Pilot build ${{ github.run_number }}" --notes "$NOTES"
          else
            gh release create latest SoloPilot.apk --title "Solo Pilot build ${{ github.run_number }}" --notes "$NOTES" --target "${{ github.sha }}"
          fi
